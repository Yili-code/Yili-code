<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title description">
  <title id="title">Yili — Backend, automation, reliable systems</title>
  <desc id="description">A dark blue profile banner with a mint signal line and subtle grid.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.58" stop-color="#0b1d32"/>
      <stop offset="1" stop-color="#10304b"/>
    </linearGradient>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5eead4" stop-opacity="0"/>
      <stop offset="0.25" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <radialGradient id="glow" cx="82%" cy="28%" r="58%">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#cbd5e1" stroke-opacity="0.055"/>
    </pattern>
  </defs>

  <rect width="1200" height="360" rx="28" fill="url(#background)"/>
  <rect width="1200" height="360" rx="28" fill="url(#glow)"/>
  <rect width="1200" height="360" rx="28" fill="url(#grid)"/>

  <g transform="translate(76 74)">
    <rect width="54" height="6" rx="3" fill="#5eead4"/>
    <text x="0" y="88" fill="#f8fafc" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="78" font-weight="700" letter-spacing="-2">YILI</text>
    <text x="2" y="136" fill="#94a3b8" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="21" font-weight="500" letter-spacing="4">BACKEND  ·  AUTOMATION  ·  RELIABLE SYSTEMS</text>
    <text x="2" y="194" fill="#cbd5e1" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="18">Building tools I want to keep using.</text>
  </g>

  <g transform="translate(692 76)">
    <path d="M0 163H48L79 132L116 174L157 90L198 119L246 40L290 76L350 12L420 57" fill="none" stroke="url(#signal)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="350" cy="12" r="7" fill="#38bdf8"/>
    <circle cx="350" cy="12" r="15" fill="none" stroke="#38bdf8" stroke-opacity="0.26" stroke-width="6"/>
    <path d="M0 215H420" stroke="#94a3b8" stroke-opacity="0.16" stroke-width="2"/>
    <text x="420" y="244" text-anchor="end" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">SIGNAL OVER NOISE</text>
  </g>
</svg>
